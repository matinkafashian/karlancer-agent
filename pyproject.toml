[project]
name = "karlancer-agent"
version = "0.1.0"
description = "Safe, VPS-deployable Karlancer proposal automation agent"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.14",
    "asyncpg>=0.30",
    "beautifulsoup4>=4.12",
    "fastapi>=0.115",
    "filelock>=3.16",
    "httpx>=0.28",
    "lxml>=5.3",
    "pydantic-settings>=2.7",
    "playwright==1.62.0",
    "pyyaml>=6.0",
    "sqlalchemy[asyncio]>=2.0",
    "uvicorn>=0.34",
]

[project.scripts]
karlancer-agent = "karlancer_agent.cli:main"

[dependency-groups]
dev = [
    "aiosqlite>=0.20",
    "mypy>=1.14",
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "ruff>=0.9",
    "types-pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/karlancer_agent"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers --basetemp=.pytest-tmp"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["karlancer_agent"]
